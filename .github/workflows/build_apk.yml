name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # --- PASTE / UPDATE THIS STEP BELOW ---
    - name: Build Debug APK
      working-directory: ./android   # <--- Change 'android' to your actual subfolder name
      run: ./gradlew assembleDebug
